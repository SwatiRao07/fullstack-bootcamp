<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Notes</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body class="auth-split-layout">
    <div class="image-side">
        <div class="image-side-content">
            <img src="assets/images/login.jpg" alt="Productivity illustration" class="auth-visual-img">
        </div>
    </div>
    <div class="auth-side">
        <div class="auth-content">
            <div class="auth-brand-wrapper">
                <div class="flex items-center gap-2 mb-12">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                    <span style="font-weight: 700; font-size: var(--fs-lg);">TaskNotes</span>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>

            <div class="auth-header" style="text-align: left;">
                <h1 class="auth-title" id="formTitle" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Welcome back</h1>
                <p class="auth-subtitle" id="formSubtitle">Please enter your details to sign in.</p>
            </div>

            <div id="formError" class="badge badge-high" style="display: none; width: 100%; justify-content: center; margin-bottom: 1.5rem; text-transform: none; padding: 0.75rem;"></div>

            <form id="loginForm" class="auth-form">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <label class="flex items-center gap-2" style="font-size: var(--fs-sm); color: var(--text-muted); cursor: pointer;">
                        <input type="checkbox" style="width: 16px; height: 16px; border-radius: 4px;"> 
                        Remember for 30 days
                    </label>
                    <a href="#" style="font-size: var(--fs-sm); color: var(--primary); text-decoration: none; font-weight: 500;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; height: 52px; font-size: 1rem;">
                    Sign in
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: var(--text-muted); font-size: var(--fs-sm);">
                    Don't have an account? 
                    <a href="#" id="toggleAuth" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="scripts/auth.js"></script>
</body>
</html>
